<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ultra-Clean Golden Amber Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="15%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glass Facet Inner Highlight Gradient -->
    <linearGradient id="innerFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Premium Drop Glow Filter -->
    <filter id="premiumGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#b45309" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Bolt -->
  <path d="M 292 28 L 126 270 L 256 270 L 216 484 L 386 242 L 256 242 Z"
        fill="#f59e0b"
        opacity="0.18"
        transform="scale(1.04) translate(-10, -10)"
        filter="url(#premiumGlow)" />

  <!-- Main Razor-Sharp Lightning Bolt Body -->
  <path d="M 292 28 L 126 270 L 256 270 L 216 484 L 386 242 L 256 242 Z"
        fill="url(#boltGrad)"
        stroke="#92400e"
        stroke-width="5"
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#premiumGlow)" />

  <!-- 3D Bevel Facet - Left / Upper Crest Shimmer -->
  <path d="M 292 28 L 126 270 L 256 270 L 236 370 L 256 242 Z"
        fill="url(#innerFacet)"
        style="mix-blend-mode: overlay;" />

  <!-- Sharp Specular Core Light Stripe -->
  <path d="M 284 48 L 146 256 L 246 256 L 224 430"
        fill="none"
        stroke="#ffffff"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.8" />
</svg>