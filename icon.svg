<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Core Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="25%" r="85%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Bolt Electric Flare Gradient (Tiranga Accent Blend) -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="35%" stop-color="#f95959" />
      <stop offset="80%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Subtle Tiranga Arc Gradient -->
    <linearGradient id="arcSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="arcGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base (Perfect Round App Badge) -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Outer Concentric Precision Track (Target Exam / Speed Ring) -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="184" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />

  <!-- Tri-color Micro Accent Arcs (Saffron & Green) -->
  <path d="M 120 256 A 136 136 0 0 1 256 120" fill="none" stroke="url(#arcSaffron)" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  <path d="M 392 256 A 136 136 0 0 1 256 392" fill="none" stroke="url(#arcGreen)" stroke-width="8" stroke-linecap="round" opacity="0.85" />

  <!-- Inner Ambient Core Glow -->
  <circle cx="256" cy="256" r="110" fill="#f95959" opacity="0.16" filter="url(#glow)" />

  <!-- Central Speed Thunderbolt Symbol (Clean, Centered, No Text) -->
  <path d="M 276 96 
           L 156 264 
           L 246 264 
           L 216 416 
           L 356 232 
           L 266 232 
           Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="10" 
        stroke-linejoin="round" 
        stroke-linecap="round"
        filter="url(#glow)" />
</svg>